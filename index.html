const clean=s=>String(s||'').replace(/[\s\-]*\(?\d.*$/,'').trim()||'Unassigned';
function toISO(v){
  if(v instanceof Date&&!isNaN(v))return v.getFullYear()+'-'+pad(v.getMonth()+1)+'-'+pad(v.getDate());
  const s=String(v||'').trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))return (m[3].length==2?'20'+m[3]:m[3])+'-'+pad(m[2])+'-'+pad(m[1]);
  return '';
}
function parseSheet(buf){
  const wb=XLSX.read(buf,{type:'array',cellDates:true});
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:true});
  const is=(c,n)=>String(c).trim().toLowerCase()===n;
  const hi=aoa.findIndex(r=>r.some(c=>is(c,'salesman'))&&r.some(c=>is(c,'party')));
  if(hi<0)throw new Error('Could not find the Salesman and Party columns. Is this the pending report?');
  const H=aoa[hi].map(c=>String(c).trim()),ix=n=>H.findIndex(h=>h.toLowerCase()===n);
  const iS=ix('salesman'),iI=ix('inv.'),iN=ix('no'),iD=ix('date'),iP=ix('party'),iT=ix('total');
  const sk=H.map((h,i)=>[h,i]).filter(([h,i])=>i>iT&&h);
  const out=[];
  for(const r of aoa.slice(hi+1)){
    const party=String(r[iP]||'').trim();
    if(!party)continue;
    const s=clean(r[iS]);if(/^office party$/i.test(s))continue;
    const bill=[r[iI],r[iN]].filter(x=>x!=='').join('-'),date=toISO(r[iD]);
    for(const[h,i]of sk){const q=Number(r[i]);if(q>0)out.push([s,party,bill,date,h.toUpperCase(),Math.round(q*100)/100])}
  }
  if(!out.length)throw new Error('No bill lines found in the sheet');
  return out;
}
function asOf(name){
  const m=name.match(/(\d{1,2})[_\-\s]([A-Za-z]{3})[A-Za-z]*[_\-\s](\d{4}|\d{2})(?!\d)/);
  if(m){const i=MON.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());if(i>=0)return (+m[1])+' '+MON[i]+' '+(m[3].length==2?'20'+m[3]:m[3])}
  const n=new Date();return n.getDate()+' '+MON[n.getMonth()]+' '+n.getFullYear();
}
function buildDoc(d){
  const S='<'+'script',E='<'+'/script>';
  return '<!DOCTYPE html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Pending Bills</title>'+S+' src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">'+E+'<style id="st">'+$('st').textContent+'</style></head><body><div id="root"></div>'+S+' id="data" type="application/json">'+JSON.stringify(d).replace(/</g,'\\u003c')+E+'\n'+S+' id="app">'+$('app').textContent+E+'</body></html>';
}

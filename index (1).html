<script id="app">

  return [...g.values()];
}
$('root').innerHTML=`<div class="w"><h1>Pending Bills</h1><div class="mut">Pending as on ${esc(D.asof||'')}</div>

<div class="card" id="s2" style="display:none"><b>2. Select outlet</b><div style="margin-top:8px"><select id="ot"></select></div></div>

function card(b,deleted){
  const d=days(b.date);
  return `<div class="card" style="${deleted?'opacity:.6':''}"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><b>Bill ${esc(b.k||'—')}</b>${ot==='*'?`<div class="mut">${esc(b.out)}</div>`:''}</div><div style="text-align:right"><div>${fd(b.date)}</div><div class="${d>30?'old':'mut'}">${d} days old</div></div></div>`+
  `<table style="margin-top:8px"><thead><tr><th>SKU</th><th class="n">Qty</th></tr></thead><tbody>${b.rs.map(r=>`<tr><td>${esc(r[4])}</td><td class="n">${inr(r[5])}</td></tr>`).join('')}<tr><td><b>Total</b></td><td class="n"><b>${inr(b.amt)}</b></td></tr></tbody></table>`+
  `<button class="${deleted?'rs':'del'}" data-b="${esc(b.k)}">${deleted?'Restore bill':'Delete bill'}</button></div>`;
}
function render(){
  const names=[...new Set([...rows.map(eff),...Object.values(asg)])].filter(Boolean).sort();
  $('sp').innerHTML='<option value="">— Select your name —</option><option value="*">All salespeople</option>'+names.map(n=>`<option ${n===sp?'selected':''}>${esc(n)}</option>`).join('');
  $('sp').value=sp;
  const kpi=(a,b,c)=>`<div><span class="mut">Pending qty</span><b>${inr(a)}</b></div><div><span class="mut">Bills</span><b>${b}</b></div><div><span class="mut">${c[0]}</span><b>${c[1]}</b></div>`;
  const msg=t=>{$('kpi').innerHTML='';$('out').innerHTML=`<div class="card mut">${t}</div>`};
  if(!rows.length){$('s2').style.display='none';return msg('No data uploaded yet.')}
  if(!sp){$('s2').style.display='none';return msg('Select your name above to begin.')}
  const all=rows.filter(r=>sp==='*'||eff(r)===sp);
  const mine=all.filter(r=>!HID.has(r[2]));
  const tb=a=>new Set(a.map(r=>r[2])).size;
  const og=group(all,1).sort((a,b)=>a.k.localeCompare(b.k)).map(g=>{const l=g.rs.filter(r=>!HID.has(r[2]));return {k:g.k,n:tb(l),amt:l.reduce((a,r)=>a+r[5],0)}});
  $('s2').style.display='block';
  $('ot').innerHTML='<option value="">— Select outlet —</option><option value="*">All my outlets ('+og.length+')</option>'+og.map(g=>`<option value="${esc(g.k)}">${esc(g.k)} · ${g.n} bills · ${inr(g.amt)}</option>`).join('');
  if(ot!=='*'&&!og.some(g=>g.k===ot))ot='';
  $('ot').value=ot;
  if(!ot){
    $('kpi').innerHTML=kpi(mine.reduce((a,r)=>a+r[5],0),tb(mine),['Outlets',og.filter(g=>g.n>0).length]);
    $('out').innerHTML='<div class="card mut">Select an outlet above to see its pending bills.</div>';return;
  }
  const selAll=ot==='*'?all:all.filter(r=>r[1]===ot);
  const sel=selAll.filter(r=>!HID.has(r[2])),del=selAll.filter(r=>HID.has(r[2]));
  const mk=rs=>group(rs,2).map(g=>({k:g.k,rs:g.rs,amt:g.amt,date:g.rs[0][3],out:g.rs[0][1]})).sort((a,b)=>a.date.localeCompare(b.date));
  const bs=mk(sel),dbs=mk(del);
  $('kpi').innerHTML=kpi(sel.reduce((a,r)=>a+r[5],0),bs.length,['SKUs',new Set(sel.map(r=>r[4])).size]);

  if(dbs.length){
    h+=`<div style="margin-top:16px"><button class="lk" id="tg">${showDel?'Hide':'Show'} ${dbs.length} deleted bill${dbs.length>1?'s':''}</button></div>`;
    if(showDel)h+=dbs.map(b=>card(b,true)).join('');
  }
  $('out').innerHTML=h;
  $('out').querySelectorAll('button.del').forEach(btn=>btn.onclick=()=>{
    const b=btn.dataset.b;
    if(armed!==b){armed=b;btn.textContent='Tap again to confirm delete';setTimeout(()=>{if(armed===b){armed='';btn.textContent='Delete bill'}},4000);return}
    armed='';HID.add(b);saveHid();render();
  });
  $('out').querySelectorAll('button.rs').forEach(btn=>btn.onclick=()=>{HID.delete(btn.dataset.b);saveHid();render()});
  const tg=$('tg');if(tg)tg.onclick=()=>{showDel=!showDel;render()};
}
$('sp').onchange=e=>{sp=e.target.value;ot='';ls_set('sp',sp);render()};
$('ot').onchange=e=>{ot=e.target.value;render()};
render();

/* ---- owner-only upload ---- */
const clean=s=>String(s||'').replace(/[\s\-]*\(?\d.*$/,'').trim()||'Unassigned';
function toISO(v){
  if(v instanceof Date&&!isNaN(v))return v.getFullYear()+'-'+pad(v.getMonth()+1)+'-'+pad(v.getDate());
  const s=String(v||'').trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))return (m[3].length==2?'20'+m[3]:m[3])+'-'+pad(m[2])+'-'+pad(m[1]);
  return '';
}
function parseSheet(buf){
  const wb=XLSX.read(buf,{type:'array',cellDates:true});
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:true});
  const is=(c,n)=>String(c).trim().toLowerCase()===n;
  const hi=aoa.findIndex(r=>r.some(c=>is(c,'salesman'))&&r.some(c=>is(c,'party')));
  if(hi<0)throw new Error('Could not find the Salesman and Party columns. Is this the pending report?');
  const H=aoa[hi].map(c=>String(c).trim()),ix=n=>H.findIndex(h=>h.toLowerCase()===n);
  const iS=ix('salesman'),iI=ix('inv.'),iN=ix('no'),iD=ix('date'),iP=ix('party'),iT=ix('total');
  const sk=H.map((h,i)=>[h,i]).filter(([h,i])=>i>iT&&h);
  const out=[];
  for(const r of aoa.slice(hi+1)){
    const party=String(r[iP]||'').trim();
    if(!party)continue;
    const s=clean(r[iS]);if(/^office party$/i.test(s))continue;
    const bill=[r[iI],r[iN]].filter(x=>x!=='').join('-'),date=toISO(r[iD]);
    for(const[h,i]of sk){const q=Number(r[i]);if(q>0)out.push([s,party,bill,date,h.toUpperCase(),Math.round(q*100)/100])}
  }
  if(!out.length)throw new Error('No bill lines found in the sheet');
  return out;
}
function asOf(name){
  const m=name.match(/(\d{1,2})[_\-\s]([A-Za-z]{3})[A-Za-z]*[_\-\s](\d{4}|\d{2})(?!\d)/);
  if(m){const i=MON.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());if(i>=0)return (+m[1])+' '+MON[i]+' '+(m[3].length==2?'20'+m[3]:m[3])}
  const n=new Date();return n.getDate()+' '+MON[n.getMonth()]+' '+n.getFullYear();
}
function buildDoc(d){
  const S='<'+'script',E='<'+'/script>';
  return '<!DOCTYPE html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Pending Bills</title>'+S+' src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">'+E+'<style id="st">'+$('st').textContent+'</style></head><body><div id="root"></div>'+S+' id="data" type="application/json">'+JSON.stringify(d).replace(/</g,'\\u003c')+E+'\n'+S+' id="app">'+$('app').textContent+E+'</body></html>';
}
$('f').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  NEW=null;$('pub').style.display='none';$('ust').textContent='Reading…';
  try{
    if(typeof XLSX==='undefined')throw new Error('Excel reader did not load. Check your internet and reload.');
    const rs=parse_(await f.arrayBuffer());
    NEW={asof:asOf(f.name),file:f.name,ver:Date.now(),rows:rs,assign:D.assign||{}};
    const o=new Set(rs.map(r=>r[1])).size,b=new Set(rs.map(r=>r[2])).size,q=rs.reduce((a,r)=>a+r[5],0);
    $('ust').textContent=`Found ${b} bills, ${o} outlets, ${rs.length} SKU lines, total qty ${inr(q)} — as on ${NEW.asof}. Publishing replaces the current data for everyone.`;
    $('pub').style.display='inline-block';
  }catch(err){$('ust').textContent=err.message||'Could not read this file'}
};
function parse_(b){return parseSheet(b)}
function download(){
  const b=new Blob([buildDoc(NEW)],{type:'text/html'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='index.html';document.body.appendChild(a);a.click();a.remove();
  $('ust').textContent='Downloaded index.html. Put it in a folder and drag that folder onto your Netlify Drop page to update the link.';
}
if(location.hash==='#admin'){$('upbox').style.display='block';$('pub').textContent='Download updated page'}

};
(async()=>{
